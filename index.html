:root{--bg:#FAF6EF;--ink:#231F1B;--mute:#7A6F66;--acc:#B94E27;--soft:#FBE7DC;--line:#EADFD2;--lav:#ECE8F7}
*{box-sizing:border-box}html,body{height:100%;margin:0}

@keyframes bar{0%,100%{height:6px}50%{height:28px}}

.sub{color:var(--mute);margin:0 0 12px}.meta{color:var(--mute);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.logo{display:flex;align-items:center;gap:6px;font:700 17px Georgia,serif;color:#E8500F;white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:14px;transition:transform .15s}
.tap:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:8px}
select{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit}
.swap{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--soft);color:var(--acc);font-size:20px;transition:transform .3s}.swap:active{transform:rotate(180deg)}
.tabs{display:flex;background:#F3EBDF;border-radius:16px;padding:4px;margin:10px 0;gap:2px}
.tabs button{flex:1;border:2px solid transparent;background:0;border-radius:12px;padding:8px 2px;color:var(--mute);font:13px system-ui;transition:.2s}.tabs i{display:block;font-style:normal;font-size:20px}
.tabs .on{background:var(--soft);border-color:var(--acc);color:var(--acc)}
textarea,input[type=text],input[type=tel]{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px;font:inherit;background:#FBF7F0}
textarea{min-height:110px;resize:vertical}
.btn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:16px;padding:14px;font:600 18px system-ui;margin-top:10px;transition:transform .1s}.btn:active{transform:scale(.97)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:6px 6px 0 0}.btn.alt{background:var(--soft);color:var(--acc)}
.out{font:600 24px/1.4 Georgia,"Noto Sans Ol Chiki",serif;margin:8px 0;min-height:34px;word-break:break-word}
.wave{display:none;gap:4px;align-items:center;height:32px;justify-content:center}.rec .wave{display:flex}
.wave b{width:5px;background:var(--acc);border-radius:3px;animation:bar .8s infinite}.wave b:nth-child(2){animation-delay:.15s}.wave b:nth-child(3){animation-delay:.3s}.wave b:nth-child(4){animation-delay:.45s}.wave b:nth-child(5){animation-delay:.6s}
.rec .mic{animation:ring 1.2s infinite;background:#d33;color:#fff}
.lav{background:var(--lav);border:0}.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #DAD3EE;cursor:pointer}.item:last-child{border:0}
.li{display:flex;gap:12px;align-items:center;cursor:pointer}.ic{width:44px;height:44px;border-radius:50%;background:#F1E8DC;display:grid;place-items:center;font-size:20px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:#fff;font-size:14px}.chip.ok{border-color:var(--acc);color:var(--acc)}
.pill{display:inline-block;background:var(--soft);color:var(--acc);border-radius:99px;padding:2px 10px;font-size:12px}
.dash{border:2px dashed #C9B9A6;border-radius:20px;padding:18px;text-align:center;color:var(--mute)}

.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}

nav{display:flex;border-top:1px solid var(--line);background:#FDFBF7;padding:6px 0 10px}

#splash,#pick{position:fixed;inset:0;background:linear-gradient(#FBF1E4,#F3DFC9);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#splash svg{animation:pop .9s both,flt 3s 1s infinite}#pick{justify-content:flex-start;padding:30px 18px;overflow:auto;align-items:stretch;z-index:8}

.obox{background:#FFF8F0;border:1px dashed var(--acc);border-radius:18px;padding:12px;margin-top:12px}
.pwv{display:none;gap:4px;align-items:center;height:30px}.spk .pwv{display:flex}.pwv b{width:5px;background:var(--acc);border-radius:3px;animation:bar .8s infinite}.pwv b:nth-child(2){animation-delay:.2s}.pwv b:nth-child(3){animation-delay:.4s}.pwv b:nth-child(4){animation-delay:.1s}.pwv b:nth-child(5){animation-delay:.3s}
.micbig{width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:40px;margin-bottom:8px}

 return H+(T?`<div class="cr">${CL.map(x=>`<span class="chip ${x==c?"dk":""}" onclick="wc2=${x};render()">${t("cls",{n:x})}</span>`).join("")}</div><button class="btn" onclick="upSheet()">${t("up_ws")}</button>`:`<span class="pill">${t("cls",{n:c})}</span>`)+`<div style="margin-top:12px">`+(L.length?L.map(w=>{const d=S.sub.find(x=>x.id==w.id&&x.by==u.name);return`<div class="card tap li" onclick="wv='${w.id}';render()"><span class="ic">📝</span><div style="flex:1"><b>${esc(w.title)}</b><div class="meta">${T?t("n_sub",{n:S.sub.filter(x=>x.id==w.id).length}):d?t("completed"):t("todo")}</div></div>›</div>`}).join(""):`<p class="meta">${t("no_ws",{n:c})}</p>`)+`</div>`}

 return`<button class="btn sm alt" onclick="wv=null;render()">${t("back")}</button><h1>${esc(w.title)}</h1><div class="meta">${t("cls",{n:w.cls})}</div>`+(w.file?(w.file.startsWith("data:image")?`<img src="${w.file}" style="width:100%;border-radius:14px;margin:8px 0">`:`<a class="btn sm" href="${w.file}" download="${esc(w.title)}.pdf" style="text-decoration:none">${t("open_wsf")}</a>`):"")+
 (T?`<h2>${t("subs")}</h2>`+(S.sub.filter(x=>x.id==id).map(x=>`<div class="card"><b>${esc(x.by)}</b>${x.a.map((a,i)=>`<div class="meta">${i+1}. ${esc(w.q[i]||"")}</div><div>${esc(a)}</div>`).join("")}</div>`).join("")||`<p class="meta">${t("none_yet")}</p>`)+`<button class="btn alt" onclick="S.ws=S.ws.filter(x=>x.id!='${id}');wv=null;sv();render()">${t("del_ws")}</button>`
 :w.q.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q)}</b><textarea class="ans" ${d?"disabled":""}>${d?esc(d.a[i]||""):""}</textarea></div>`).join("")+(d?`<span class="pill">${t("completed")}</span>`:`<button class="btn" onclick="subWs('${id}')">${t("submit")}</button>`))}
function subWs(id){S.sub.push({id,by:S.user.name,a:[...document.querySelectorAll(".ans")].map(x=>x.value)});sv();toast(t("sub_ok"));render()}
function upSheet(){if(!S.user||S.user.role!=="teacher")return toast(t("only_t"));open(`<h2>${t("up_title")}</h2><input type="text" id="wt" placeholder="${t("w_title")}"><br><br><select id="wcl">${CL.map(c=>`<option value="${c}" ${c==wc2?"selected":""}>${t("cls",{n:c})}</option>`).join("")}</select><br><br><input type="file" id="wf" accept=".pdf,image/*"><p class="meta">${t("w_file")}</p><textarea id="wq" placeholder="${t("w_q")}"></textarea><button class="btn" onclick="saveWs()">${t("publish")}</button>`)}
function saveWs(){const ti=$("#wt").value.trim(),f=$("#wf").files[0],q=$("#wq").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!ti||(!f&&!q.length))return toast(t("add_title"));if(f&&f.size>1.5e6)return toast(t("too_big"));
 const c=+$("#wcl").value,fin=file=>{S.ws.unshift({id:"w"+Date.now(),title:ti,cls:c,file,q,by:S.user.name});wc2=c;sv();shut();render()};
 if(f){const r=new FileReader();r.onload=()=>fin(r.result);r.readAsDataURL(f)}else fin("")}

 p.innerHTML=`${logo()}<h1 id="ph1" style="margin-top:14px"></h1><p class="sub" id="ph2"></p>${m?`<button class="btn sm alt" id="px" style="align-self:flex-start">✕ ${t("close")}</button>`:""}<input type="text" class="srch" id="pq"><div class="cr" id="pc"></div><div id="pl"></div><button class="btn stick" id="go"></button>`;
 const draw=()=>{$("#ph1").textContent=pt("pick");$("#ph2").textContent=pt("pick_sub");$("#pq").placeholder=pt("pick_ph");$("#go").textContent=pt("cont");
  $("#pc").innerHTML=sts.map(x=>`<span class="chip ${x==st?"dk":""}" data-s="${x}">${x=="All"?pt("all"):x}</span>`).join("");
  $("#pl").innerHTML=PL.filter(l=>(st=="All"||l[3].includes(st))&&(l[1]+l[2]+l[3]).toLowerCase().includes(q)).map(l=>`<div class="lg ${l[0]==sel?"on":""}" data-c="${l[0]}" ${l[6]?"":'style="opacity:.55"'}><span class="gl" style="background:${l[5]}">${l[4]}</span><span><b>${l[1]}</b> <span class="meta">(${l[2]})</span>${l[6]?"":` <span class="meta">(${t("soon")})</span>`}</span><span class="meta st">${l[3]}</span></div>`).join("")};
 draw();$("#pq").oninput=e=>{q=e.target.value.toLowerCase();draw()};
 p.onclick=e=>{const c=e.target.closest(".chip"),g=e.target.closest(".lg");if(c){st=c.dataset.s;draw()}if(g){const l=PL.find(x=>x[0]==g.dataset.c);if(!l[6])return toast(t("soon_toast"));sel=l[0];draw()}};
 // Continue: save the choice and re-render every page, the nav bar and the translator defaults in the new language

function fadeOut(el,cb){el.classList.remove("on");setTimeout(()=>{el.style.display="none";cb&&cb()},600)}
function showBrand(next){const b=$("#brand");b.style.display="flex";void b.offsetWidth;b.classList.add("on");let done=0;const end=()=>{if(done)return;done=1;fadeOut(b,next)};b.onclick=end;setTimeout(end,2800)}
async function micState(){try{if(navigator.permissions){const p=await navigator.permissions.query({name:"microphone"});return p.state}}catch(e){}return"unknown"}
async function askMic(next){const st=await micState();if(S.micAsked||st=="granted"||st=="denied")return next();
 const p=$("#micp");$("#mt").textContent=t("mic_t");$("#mb").textContent=t("mic_b");$("#ma").textContent=t("mic_allow");$("#ms").textContent=t("mic_skip");$("#mst").textContent="";
 p.style.display="flex";void p.offsetWidth;p.classList.add("on");
 const fin=()=>{S.micAsked=1;sv();fadeOut(p,next)};
 $("#ms").onclick=fin;
 $("#ma").onclick=async()=>{$("#ma").disabled=true;let ok=false;try{const m=await navigator.mediaDevices.getUserMedia({audio:true});m.getTracks().forEach(x=>x.stop());ok=true}catch(e){}
  $("#mst").textContent=ok?t("mic_ok"):t("mic_no");$("#ms").style.display="none";$("#ma").textContent=t("mic_cont");$("#ma").disabled=false;$("#ma").onclick=fin;if(ok)setTimeout(fin,900)}}
